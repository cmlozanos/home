<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111b35"><meta name="description" content="Salta entre prismas y constelaciones. Tres caminos originales para pequeños exploradores."><title>Salto Neón</title><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="icons/icon-192.png"><link rel="stylesheet" href="style.css?v=20260925-1"><script defer src="learning-gate.js?v=20260925-1"></script><script defer src="core.js?v=20260925-1"></script><script defer src="game.js?v=20260925-1"></script></head><body>
<canvas id="world" aria-label="Circuito de plataformas. Toca para saltar"></canvas>
<header><a class="icon-button" href="https://cmlozanos.github.io/games/" aria-label="Todos los juegos">⌂</a><button id="home" aria-label="Elegir circuito">▦</button><div id="progress" role="progressbar" aria-label="Progreso del circuito" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><i></i></div><button id="pause" aria-label="Pausar partida">Ⅱ</button><button id="help" aria-label="Ayuda y opciones">?</button></header>
<main id="menu" class="panel"><div class="eyebrow">PEQUEÑAS AVENTURAS</div><div class="hero-icon" aria-hidden="true">◇</div><h1>Salto Neón</h1><p class="gesture" aria-label="Toca para saltar">☝ → ↗</p><div class="level-picker" role="group" aria-label="Elegir circuito"><button data-level="0" aria-label="Circuito 1 Aurora"><span>🌅</span><small>1</small></button><button data-level="1" aria-label="Circuito 2 Órbita"><span>🪐</span><small>2</small></button><button data-level="2" aria-label="Circuito 3 Prisma"><span>💎</span><small>3</small></button></div><div class="choices"><button id="difficulty" aria-label="Dificultad tranquila. Cambiar dificultad">🐢</button><button id="assist" aria-label="Desactivar ayuda de salto" aria-pressed="true">🪄</button><button id="hold" aria-label="Desactivar salto continuo al mantener pulsado" aria-pressed="true">☝∞</button></div><button id="play" class="play" aria-label="Jugar">▶</button><span class="best" id="best" aria-label="Circuitos completados"></span></main>

<section id="help-panel" class="panel help-panel" hidden aria-label="Ayuda"><button id="close-help" class="close" aria-label="Cerrar ayuda">×</button><h2>☝ → ↗</h2><p>Toca la pantalla o pulsa espacio para saltar.</p><p>🪄 Ayuda con los saltos difíciles.<br>☝∞ Mantén pulsado para repetir el salto.<br>🚩 Reintenta desde el punto de control.<br>☾ Los portales cambian la gravedad.</p><button id="sound" aria-label="Activar sonido" aria-pressed="false">🔇</button><button id="install" aria-label="Instalar juego" hidden>↓</button><p class="credits"><a href="CREDITS.md">Créditos y código abierto</a></p></section>
